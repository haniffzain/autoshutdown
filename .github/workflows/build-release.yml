name: Build AutoShutdown

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.2.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Debian package
        run: |
          chmod +x linux/build-deb.sh
          ./linux/build-deb.sh "${{ steps.version.outputs.version }}"

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoShutdown-Linux-DEB
          path: dist/*.deb

  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build standalone EXE
        shell: powershell
        run: .\windows\build.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoShutdown-Windows-EXE
          path: dist/AutoShutdown.exe
